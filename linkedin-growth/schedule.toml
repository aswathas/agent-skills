# Read at run time by the scheduled job.
# Edit freely. Changing topics/weights needs no reschedule; changing `cron` does.

enabled         = true

# Daily at 09:00 local. Avoids :00 only when the time is approximate — this one
# was named explicitly.
cron            = "0 9 * * *"

topics          = ["ai-news"]
weights         = [1.0]

# true  = publish through postiee when the draft passes the gate
# false = leave the draft and card in drafts/ and report them
auto_publish    = true

visibility      = "PUBLIC"
max_per_day     = 1
use_project_log = true

angle           = "practitioner. What this changes for someone running agents in production, and what to check before believing the benchmark."
